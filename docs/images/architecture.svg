<svg viewBox="0 0 980 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ARIA architecture: the browser dashboard talks only to the local Python server, which is the sole component that calls NetApp's OAuth and Active IQ GraphQL APIs and persists results to a local SQLite cache; nothing else leaves the machine.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5FD4E3"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C8AA5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="460" fill="#0B1220"/>

  <!-- Machine boundary -->
  <rect x="30" y="30" width="560" height="400" rx="14" fill="none" stroke="#2A3A55" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="50" y="58" font-family="Calibri, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#7C8AA5">YOUR MACHINE — NOTHING LEAVES THIS BOUNDARY EXCEPT NETAPP API CALLS</text>

  <!-- Browser box -->
  <rect x="60" y="90" width="230" height="120" rx="10" fill="#121C2E" stroke="#2A3A55" stroke-width="1.5"/>
  <text x="175" y="122" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Browser Dashboard</text>
  <text x="175" y="146" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">app.js (~33,000 lines)</text>
  <text x="175" y="166" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">renders dashboard + 14</text>
  <text x="175" y="184" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">deliverables from cache</text>

  <!-- Server box -->
  <rect x="360" y="90" width="200" height="120" rx="10" fill="#121C2E" stroke="#5FD4E3" stroke-width="2"/>
  <text x="460" y="122" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">server.py</text>
  <text x="460" y="146" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">local HTTP server</text>
  <text x="460" y="166" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">sole component that</text>
  <text x="460" y="184" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">calls external APIs</text>

  <!-- Browser <-> Server arrow -->
  <line x1="290" y1="150" x2="358" y2="150" stroke="#5FD4E3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="324" y="140" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#5FD4E3">fetch /api/*</text>

  <!-- SQLite cache -->
  <rect x="360" y="260" width="200" height="100" rx="10" fill="#121C2E" stroke="#2A3A55" stroke-width="1.5"/>
  <text x="460" y="295" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">SQLite Cache</text>
  <text x="460" y="318" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">aiq_cache.db — full fleet</text>
  <text x="460" y="336" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">offline after first sync</text>

  <!-- Server <-> SQLite arrow -->
  <line x1="460" y1="210" x2="460" y2="258" stroke="#7C8AA5" stroke-width="1.5" marker-end="url(#arrowMuted)"/>
  <line x1="472" y1="258" x2="472" y2="210" stroke="#7C8AA5" stroke-width="1.5" marker-end="url(#arrowMuted)"/>
  <text x="510" y="238" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#7C8AA5">read / write</text>

  <!-- Reference Library -->
  <rect x="60" y="260" width="230" height="140" rx="10" fill="#121C2E" stroke="#2A3A55" stroke-width="1.5"/>
  <text x="175" y="292" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Reference Library</text>
  <text x="175" y="315" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">70+ CVEs · EOA/EOS data</text>
  <text x="175" y="333" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">firmware baselines</text>
  <text x="175" y="351" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">local JSON files</text>
  <text x="175" y="369" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">refreshed on sync</text>

  <line x1="290" y1="330" x2="358" y2="330" stroke="#7C8AA5" stroke-width="1.5" marker-end="url(#arrowMuted)"/>
  <text x="324" y="320" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#7C8AA5">enriches</text>

  <!-- External: NetApp -->
  <rect x="700" y="90" width="230" height="90" rx="10" fill="#1A2A22" stroke="#3BAE6B" stroke-width="1.5"/>
  <text x="815" y="120" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">NetApp OAuth</text>
  <text x="815" y="142" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">api.activeiq.netapp.com</text>
  <text x="815" y="160" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">token exchange</text>

  <rect x="700" y="210" width="230" height="90" rx="10" fill="#1A2A22" stroke="#3BAE6B" stroke-width="1.5"/>
  <text x="815" y="240" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Active IQ GraphQL</text>
  <text x="815" y="262" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">gql.aiq.netapp.com</text>
  <text x="815" y="280" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">8+ queries, TLS 1.2+</text>

  <line x1="590" y1="135" x2="698" y2="135" stroke="#3BAE6B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="255" x2="698" y2="255" stroke="#3BAE6B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="644" y="125" text-anchor="middle" font-family="Calibri, Arial, sans-serif" font-size="11" fill="#3BAE6B">only external calls</text>

  <!-- legend -->
  <rect x="700" y="330" width="16" height="16" fill="none" stroke="#3BAE6B" stroke-width="1.5"/>
  <text x="724" y="343" font-family="Calibri, Arial, sans-serif" font-size="12" fill="#9FB0C6">Official NetApp endpoints only — no other network egress</text>
</svg>
